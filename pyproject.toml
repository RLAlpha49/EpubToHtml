[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "EpubToHtml"
version = "1.0.0"
description = "Convert EPUB publications into one navigable HTML document."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.15",
  "chardet>=7.4.3",
  "ebooklib>=0.20",
  "rich>=15.0.0",
]

[project.scripts]
epub-to-html = "cli:main"

[tool.setuptools]
py-modules = ["cli", "converter", "html_transform", "images", "model", "output"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]

ignore = [
  "E501",   # line too long (handled by formatter)
  "W505",   # doc line too long (handled by formatter)
  "SIM105", # use contextlib.suppress for exceptions (not always applicable)
  "UP024",
]

[tool.mypy]
exclude = ["typings"]
ignore_missing_imports = true
mypy_path = ["typings"]

[tool.pylint]
ignore = [".venv", "typings"]
max-line-length = 120
indent-string = '    '

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
