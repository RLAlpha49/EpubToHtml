[tool.ruff]
line-length = 100

[tool.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]

ignore = [
  "E501",   # line too long (handled by formatter)
  "W505",   # doc line too long (handled by formatter)
  "SIM105", # use contextlib.suppress for exceptions (not always applicable)
  "UP024",
]

[tool.mypy]
exclude = ["typings"]
ignore_missing_imports = true

[tool.pylint]
ignore = [".venv", "typings"]
max-line-length = 120
indent-string = '    '
