[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-to-html"
version = "1.0.0"
description = "Convert EPUB publications into one navigable HTML document."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "RLAlpha49" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "beautifulsoup4>=4.15,<5",
  "chardet>=7.4.3,<8",
  "ebooklib>=0.20,<1",
  "rich>=15.0.0,<16",
]

[project.urls]
Homepage = "https://github.com/RLAlpha49/EpubToHtml"
Repository = "https://github.com/RLAlpha49/EpubToHtml"
Issues = "https://github.com/RLAlpha49/EpubToHtml/issues"

[project.scripts]
epub-to-html = "cli:main"

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "mypy>=2.3.0,<3",
  "nox[pbs]>=2026.7.11,<2027",
  "pip-tools>=7.5,<8",
  "pytest>=9.0.3,<10",
  "ruff>=0.14,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "converter", "html_transform", "images", "model", "output"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]

ignore = [
  "E501",   # line too long (handled by formatter)
  "W505",   # doc line too long (handled by formatter)
  "SIM105", # use contextlib.suppress for exceptions (not always applicable)
  "UP024",
]

[tool.mypy]
files = ["src", "tests"]
mypy_path = ["typings"]
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
